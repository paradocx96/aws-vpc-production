AWSTemplateFormatVersion: '2010-09-09'
Description: Secure S3 backend bucket for Terraform state

Resources:
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: navindadev-terraform-state-bucket

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Purpose
          Value: TerraformState
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Environment
          Value: Shared

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub '${TerraformStateBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  TerraformStateBucketName:
    Description: Use this name in the Terraform S3 backend configuration
    Value: !Ref TerraformStateBucket

  TerraformStateBucketArn:
    Description: ARN of the Terraform state bucket
    Value: !GetAtt TerraformStateBucket.Arn

  StateRegion:
    Description: AWS Region where the bucket was created
    Value: !Ref AWS::Region
